name: Update Games From Truffled

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download game catalog
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/aukak/truffled/main/public/js/json/g.json \
            -o truffled-games.json

      - name: Build games.json
        run: |
          python3 <<'PY'
          import json
          import os

          SOURCE = "truffled-games.json"
          OUTPUT = "games.json"

          with open(SOURCE, "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          if not games:
              raise SystemExit(
                  "ERROR: No games found. Existing games.json was NOT changed."
              )

          output = []

          for game in games:
              name = game.get("name")
              url = game.get("url")
              thumbnail = game.get("thumbnail")
              frame_type = game.get("frameType", "iframe")

              if not name or not url:
                  continue

              # Convert relative game URLs to absolute URLs.
              if url.startswith("/"):
                  url = "https://truffled.lol" + url
              elif not url.startswith("http"):
                  url = "https://truffled.lol/" + url

              # Convert relative thumbnail URLs to absolute URLs.
              if thumbnail:
                  if thumbnail.startswith("/"):
                      thumbnail = "https://truffled.lol" + thumbnail
                  elif not thumbnail.startswith("http"):
                      thumbnail = "https://truffled.lol/" + thumbnail

              item = {
                  "name": name,
                  "url": url,
                  "frameType": frame_type
              }

              if thumbnail:
                  item["thumbnail"] = thumbnail

              if game.get("altNames"):
                  item["altNames"] = game["altNames"]

              if game.get("requiresPrefix"):
                  item["requiresPrefix"] = True

              output.append(item)

          if not output:
              raise SystemExit(
                  "ERROR: Catalog contained no usable games. "
                  "Existing games.json was NOT changed."
              )

          # Remove duplicate URLs.
          unique = {}

          for game in output:
              unique[game["url"]] = game

          output = list(unique.values())

          # Alphabetical order.
          output.sort(
              key=lambda game: game["name"].lower()
          )

          # Backup existing games.json.
          if os.path.exists(OUTPUT):
              with open(OUTPUT, "r", encoding="utf-8") as f:
                  old = f.read()

              with open(
                  OUTPUT + ".backup",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(old)

          # Write new catalog.
          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print(f"Added {len(output)} games.")
          PY

      - name: Remove temporary files
        run: |
          rm -f truffled-games.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json games.json.backup

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update games catalog"
          git push
