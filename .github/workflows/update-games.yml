name: Update Games From Source

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Truffled game source
        run: |
          curl -L --fail \
            "https://truffled.lol/js/json/g.json" \
            -o truffled-games.json

      - name: Generate games.json
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          SOURCE = "truffled-games.json"
          OUTPUT = "games.json"

          with open(SOURCE, "r", encoding="utf-8") as f:
              source = json.load(f)

          games = source.get("games", [])

          if not isinstance(games, list):
              raise SystemExit("ERROR: Truffled source does not contain a games list.")

          if len(games) == 0:
              raise SystemExit(
                  "ERROR: Truffled returned 0 games. "
                  "games.json was NOT changed."
              )

          print(f"Found {len(games)} games.")

          result = []

          for game in games:
              if not isinstance(game, dict):
                  continue

              name = str(game.get("name", "")).strip()
              url = str(game.get("url", "")).strip()
              thumbnail = str(game.get("thumbnail", "")).strip()

              if not name or not url:
                  continue

              # Make relative Truffled URLs absolute.
              if url.startswith("/"):
                  url = "https://truffled.lol" + url

              if thumbnail.startswith("/"):
                  thumbnail = "https://truffled.lol" + thumbnail

              item = {
                  "name": name,
                  "url": url
              }

              if thumbnail:
                  item["thumbnail"] = thumbnail

              if game.get("altNames"):
                  item["altNames"] = game["altNames"]

              if game.get("frameType"):
                  item["frameType"] = game["frameType"]

              if game.get("requiresPrefix"):
                  item["requiresPrefix"] = True

              result.append(item)

          if len(result) == 0:
              raise SystemExit(
                  "ERROR: No usable games were found. "
                  "games.json was NOT changed."
              )

          # Remove duplicates by URL.
          unique = {}
          for game in result:
              unique[game["url"]] = game

          result = list(unique.values())

          # Sort alphabetically.
          result.sort(key=lambda x: x["name"].lower())

          # Backup the current file before changing it.
          if os.path.exists(OUTPUT):
              with open(OUTPUT, "r", encoding="utf-8") as f:
                  old = f.read()

              with open(OUTPUT + ".backup", "w", encoding="utf-8") as f:
                  f.write(old)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Saved {len(result)} games to {OUTPUT}.")
          PY

      - name: Remove temporary source
        run: |
          rm -f truffled-games.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json games.json.backup

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update games from Truffled source"
          git push
