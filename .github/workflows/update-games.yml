name: Update Game Sources

on:
  push:
    branches: [main]
    paths-ignore:
      - games.json
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build game catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT = Path("games.json")
          API = "https://api.github.com"
          CDN = "https://cdn.jsdelivr.net/gh"

          def request(url, json_mode=False):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Games-Source-Updater/1.0",
                  "Accept": "application/vnd.github+json"
              })
              if "api.github.com" in url and os.environ.get("GH_TOKEN"):
                  req.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
              return json.loads(raw) if json_mode else raw.decode("utf-8", "replace")

          def repo_info(repo):
              return request(f"{API}/repos/{repo}", True)

          def default_branch(repo):
              try:
                  return repo_info(repo).get("default_branch") or "main"
              except Exception:
                  return "main"

          def tree(repo, branch=None):
              branch = branch or default_branch(repo)
              data = request(f"{API}/repos/{repo}/git/trees/{urllib.parse.quote(branch, safe='')}" "?recursive=1", True)
              return [x["path"] for x in data.get("tree", []) if x.get("type") == "blob"]

          def js(repo, path, branch=None):
              return f"{CDN}/gh/{repo}@{branch or default_branch(repo)}/{path.lstrip('/')}"

          def add(games, name, url, thumbnail="", source="", frame_type="iframe"):
              if not name or not url:
                  return
              games.append({
                  "name": str(name).strip(),
                  "url": str(url).strip(),
                  "thumbnail": str(thumbnail or "").strip(),
                  "source": source,
                  "frameType": frame_type
              })

          def title_from_path(path):
              n = path.rsplit("/",1)[-1]
              n = re.sub(r"\.(html?|htm)$","",n,flags=re.I)
              n = re.sub(r"^cl[-_]?", "", n, flags=re.I)
              n = re.sub(r"[-_]+"," ",n)
              return n.strip().title() or "Untitled Game"

          games = []
          errors = []

          # Keep games already belonging to the user's own site.
          if OUT.exists():
              try:
                  old = json.loads(OUT.read_text(encoding="utf-8"))
                  if isinstance(old, list):
                      for g in old:
                          if not isinstance(g, dict):
                              continue
                          src = str(g.get("source","")).lower()
                          if src in ("", "testgames", "github", "local"):
                              item = dict(g)
                              item["source"] = "testgames"
                              if not item.get("url") and item.get("folder") and item.get("file"):
                                  item["url"] = (
                                      "https://natepzzbrt-hash.github.io/Games/"
                                      + str(item["folder"]).strip("/") + "/"
                                      + str(item["file"]).lstrip("/")
                                  )
                              if item.get("url"):
                                  games.append(item)
              except Exception:
                  pass

          # GN-Math
          try:
              zones = request(f"{CDN}/gh/freebuisness/assets@main/zones.json", True)
              html_base = f"{CDN}/gh/freebuisness/html@main"
              cover_base = f"{CDN}/gh/freebuisness/covers@main"
              for z in zones if isinstance(zones,list) else []:
                  if not isinstance(z,dict) or z.get("id") in (None,-1):
                      continue
                  if str(z.get("name","")).startswith("[!]"):
                      continue
                  url = str(z.get("url","")).strip()
                  url = url.replace("{HTML_URL}",html_base).replace("{COVER_URL}",cover_base)
                  if not url.startswith("http"):
                      url = f"{html_base}/{z['id']}.html"
                  cover = str(z.get("cover","")).strip().replace("{COVER_URL}",cover_base)
                  if cover and not cover.startswith("http"):
                      cover = f"{cover_base}/{cover.lstrip('/')}"
                  add(games,z.get("name"),url,cover,"gn")
          except Exception as e:
              errors.append("GN-Math: "+str(e))

          # Elite Gamez
          try:
              base = f"{CDN}/gh/1234chromebook1234-creator/ww@main"
              data = request(base+"/games.json",True)
              for g in data if isinstance(data,list) else []:
                  url = str(g.get("url","")).strip()
                  img = str(g.get("image","")).strip()
                  if url and not url.startswith("http"): url=base+"/"+url.lstrip("/")
                  if img and not img.startswith("http"): img=base+"/"+img.lstrip("/")
                  add(g,g.get("title") or g.get("name"),url,img,"elite")
          except Exception as e:
              errors.append("Elite Gamez: "+str(e))

          # Ultimate Game Stash
          for repo in ("tharun9772/ugs-1","tharun9772/ugs-2","tharun9772/ugs-3"):
              try:
                  branch=default_branch(repo)
                  for p in tree(repo,branch):
                      if re.match(r"^cl.*\.html?$",p,re.I):
                          add(
                              games,title_from_path(p),js(repo,p,branch),
                              f"{CDN}/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/img/fallback.png",
                              "ugs"
                          )
              except Exception as e:
                  errors.append(repo+": "+str(e))

          # Chicken Kings Vault
          try:
              base=f"{CDN}/gh/carbonicality/ChickenKingsVault@main"
              data=request(base+"/games.json",True)
              for g in data if isinstance(data,list) else []:
                  url=str(g.get("html","")).strip()
                  img=str(g.get("img","")).strip()
                  if url and not url.startswith("http"): url=base+"/gamefiles/"+url.lstrip("/")
                  if img and not img.startswith("http"): img=base+"/images/"+img.lstrip("/")
                  add(games,g.get("name"),url,img,"ckv")
          except Exception as e:
              errors.append("Chicken Kings Vault: "+str(e))

          # Noah's Tutoring
          try:
              base=f"{CDN}/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master"
              loaded=False
              try:
                  data=request(base+"/games.json",True)
                  entries=data if isinstance(data,list) else data.get("games",[])
                  for g in entries if isinstance(entries,list) else []:
                      url=str(g.get("url","")).strip()
                      img=str(g.get("image") or g.get("img") or "").strip()
                      if url and not url.startswith("http"): url=base+"/"+url.lstrip("/")
                      if img and not img.startswith("http"): img=base+"/images/"+img.lstrip("/")
                      add(games,g.get("title") or g.get("name"),url,img,"noah")
                  loaded=True
              except Exception:
                  pass
              if not loaded:
                  text=request(base+"/games.js")
                  rx=re.compile(r'\{\s*title:\s*["\'](.*?)["\'].*?url:\s*["\'](.*?)["\'](?:.*?image:\s*["\'](.*?)["\'])?.*?\}',re.S)
                  for m in rx.finditer(text):
                      name,url,img=m.group(1),m.group(2),m.group(3) or ""
                      if not url.startswith("http"): url=base+"/"+url.lstrip("/")
                      if img and not img.startswith("http"): img=base+"/images/"+img.lstrip("/")
                      add(games,name,url,img,"noah")
          except Exception as e:
              errors.append("Noah's Tutoring: "+str(e))

          # Truffled
          try:
              data=request("https://truffled.lol/js/json/g.json",True)
              entries=data if isinstance(data,list) else data.get("games",[])
              for g in entries if isinstance(entries,list) else []:
                  url=str(g.get("url","")).strip()
                  img=str(g.get("thumbnail") or g.get("image") or g.get("img") or "").strip()
                  if url: url=urllib.parse.urljoin("https://truffled.lol/",url)
                  if img: img=urllib.parse.urljoin("https://truffled.lol/",img)
                  add(games,g.get("name") or g.get("title"),url,img,"truffled",g.get("frameType","iframe"))
          except Exception as e:
              errors.append("Truffled: "+str(e))

          # Remove unwanted old sources and invalid entries.
          games=[
              g for g in games
              if g.get("url")
              and str(g.get("source","")).lower() not in ("ubz","seraph","lumin")
              and "raw.githubusercontent.com" not in str(g.get("url","")).lower()
          ]

          # Deduplicate by source + URL so two legitimate sources can share a URL.
          final=[]
          seen=set()
          for g in games:
              key=(str(g.get("source","")),str(g.get("url","")).rstrip("/"))
              if key in seen:
                  continue
              seen.add(key)
              final.append(g)

          external=[g for g in final if g.get("source")!="testgames"]
          if not external:
              print("No external games loaded; refusing to overwrite games.json.")
              for e in errors: print("WARNING:",e)
              raise SystemExit(0)

          OUT.write_text(json.dumps(final,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(f"Wrote {len(final)} games.")
          for e in errors: print("WARNING:",e)
          PY

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update game source catalog"
          git push
