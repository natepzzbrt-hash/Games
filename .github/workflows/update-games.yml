name: Update Embedded Games

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Truffled game catalog
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/aukak/truffled/main/public/js/json/g.json \
            -o truffled-games.json

      - name: Generate game library
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import html

          with open("truffled-games.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          if not games:
              raise SystemExit(
                  "ERROR: 0 games found. Nothing was changed."
              )

          os.makedirs("games", exist_ok=True)

          catalog = []

          for game in games:
              name = str(game.get("name", "")).strip()
              remote_url = str(game.get("url", "")).strip()
              thumbnail = str(game.get("thumbnail", "")).strip()

              if not name or not remote_url:
                  continue

              # Make game URL absolute
              if remote_url.startswith("/"):
                  remote_url = "https://truffled.lol" + remote_url
              elif not remote_url.startswith(("http://", "https://")):
                  remote_url = "https://truffled.lol/" + remote_url

              # Make thumbnail URL absolute
              if thumbnail.startswith("/"):
                  thumbnail = "https://truffled.lol" + thumbnail
              elif thumbnail and not thumbnail.startswith(("http://", "https://")):
                  thumbnail = "https://truffled.lol/" + thumbnail

              # Safe folder name
              slug = re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "-",
                  name
              ).strip("-").lower()

              if not slug:
                  continue

              folder = os.path.join("games", slug)
              os.makedirs(folder, exist_ok=True)

              safe_name = html.escape(name)
              safe_url = html.escape(remote_url, quote=True)

              # Individual embedded game page
              game_html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1.0">
          <title>{safe_name}</title>

          <style>
          html, body {{
              margin: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
          }}

          iframe {{
              width: 100%;
              height: 100%;
              border: 0;
              display: block;
          }}
          </style>
          </head>

          <body>
          <iframe
              src="{safe_url}"
              allow="fullscreen; autoplay; gamepad; pointer-lock"
              allowfullscreen>
          </iframe>
          </body>
          </html>
          """

              with open(
                  os.path.join(folder, "index.html"),
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(game_html)

              catalog.append({
                  "name": name,
                  "slug": slug,
                  "url": "games/" + slug + "/",
                  "embed": remote_url,
                  "thumbnail": thumbnail
              })

          if not catalog:
              raise SystemExit(
                  "ERROR: No usable games were generated."
              )

          catalog.sort(
              key=lambda x: x["name"].lower()
          )

          # Save catalog
          with open(
              "games.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  catalog,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          # -----------------------------------------
          # ROOT INDEX.HTML
          # -----------------------------------------

          cards = []

          for game in catalog:
              name = html.escape(game["name"])
              slug = html.escape(game["slug"])
              thumb = html.escape(game["thumbnail"], quote=True)

              if thumb:
                  image = f'<img src="{thumb}" alt="{name}" loading="lazy">'
              else:
                  image = '<div class="no-image">🎮</div>'

              cards.append(f"""
              <a class="card"
                 href="games/{slug}/"
                 data-name="{name.lower()}">
                  <div class="thumb">
                      {image}
                  </div>
                  <div class="game-name">{name}</div>
              </a>
              """)

          cards_html = "\n".join(cards)

          index_html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1.0">

          <title>Games</title>

          <style>

          * {{
              box-sizing: border-box;
          }}

          html, body {{
              margin: 0;
              padding: 0;
              min-height: 100%;
              background: #0b0b0b;
              color: white;
              font-family: Arial, sans-serif;
          }}

          body {{
              padding: 25px;
          }}

          .top {{
              display: flex;
              justify-content: center;
              margin-bottom: 25px;
          }}

          #search {{
              width: min(500px, 90vw);
              padding: 13px 20px;
              border-radius: 999px;
              border: 1px solid #333;
              background: #171717;
              color: white;
              outline: none;
              font-size: 15px;
          }}

          #search:focus {{
              border-color: #666;
          }}

          .games {{
              display: grid;
              grid-template-columns:
                  repeat(auto-fill, minmax(180px, 1fr));
              gap: 18px;
          }}

          .card {{
              display: block;
              text-decoration: none;
              color: white;
              background: #151515;
              border-radius: 14px;
              overflow: hidden;
              border: 1px solid #252525;
              transition: transform .15s, border-color .15s;
          }}

          .card:hover {{
              transform: translateY(-3px);
              border-color: #555;
          }}

          .thumb {{
              width: 100%;
              aspect-ratio: 16 / 9;
              background: #202020;
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
          }}

          .thumb img {{
              width: 100%;
              height: 100%;
              object-fit: cover;
          }}

          .no-image {{
              font-size: 40px;
          }}

          .game-name {{
              padding: 12px;
              font-weight: bold;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
          }}

          </style>
          </head>

          <body>

          <div class="top">
              <input
                  id="search"
                  type="search"
                  placeholder="Search games..."
                  autocomplete="off">
          </div>

          <div class="games" id="games">
              {cards_html}
          </div>

          <script>

          const search = document.getElementById("search");
          const cards = document.querySelectorAll(".card");

          search.addEventListener("input", () => {{

              const query = search.value.toLowerCase().trim();

              cards.forEach(card => {{

                  const name = card.dataset.name;

                  card.style.display =
                      name.includes(query)
                      ? ""
                      : "none";

              }});

          }});

          </script>

          </body>
          </html>
          """

          with open(
              "index.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(index_html)

          print(
              f"Successfully generated {len(catalog)} games."
          )
          print("Created root index.html")
          PY

      - name: Remove temporary files
        run: |
          rm -f truffled-games.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html games.json games

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update game library"
          git push
