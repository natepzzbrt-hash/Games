name: Update Embedded Games

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Truffled game catalog
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/aukak/truffled/main/public/js/json/g.json \
            -o truffled-games.json

      - name: Generate embedded games
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          with open("truffled-games.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          if not games:
              raise SystemExit(
                  "No games found. NOTHING was changed."
              )

          os.makedirs("games", exist_ok=True)

          catalog = []

          for game in games:
              name = str(game.get("name", "")).strip()
              url = str(game.get("url", "")).strip()
              thumbnail = str(game.get("thumbnail", "")).strip()

              if not name or not url:
                  continue

              # Convert relative URL to full URL
              if url.startswith("/"):
                  url = "https://truffled.lol" + url

              elif not url.startswith(("http://", "https://")):
                  url = "https://truffled.lol/" + url

              # Convert thumbnail to full URL
              if thumbnail.startswith("/"):
                  thumbnail = "https://truffled.lol" + thumbnail

              elif thumbnail and not thumbnail.startswith(("http://", "https://")):
                  thumbnail = "https://truffled.lol/" + thumbnail

              # Safe folder name
              slug = re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "-",
                  name
              ).strip("-").lower()

              if not slug:
                  continue

              folder = os.path.join("games", slug)
              os.makedirs(folder, exist_ok=True)

              # Create embedded game page
              html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,initial-scale=1.0">
          <title>{name}</title>

          <style>
          * {{
              box-sizing: border-box;
          }}

          html, body {{
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
          }}

          iframe {{
              width: 100%;
              height: 100%;
              border: 0;
              display: block;
          }}
          </style>
          </head>

          <body>

          <iframe
              src="{url}"
              allowfullscreen
              allow="fullscreen; autoplay; gamepad; pointer-lock"
              scrolling="no">
          </iframe>

          </body>
          </html>
          """

              with open(
                  os.path.join(folder, "index.html"),
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(html)

              catalog.append({
                  "name": name,
                  "url": f"games/{slug}/",
                  "embed": url,
                  "thumbnail": thumbnail
              })

          # Don't replace the catalog with an empty one
          if not catalog:
              raise SystemExit(
                  "No usable games were generated."
              )

          catalog.sort(
              key=lambda x: x["name"].lower()
          )

          with open(
              "games.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  catalog,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print(
              f"Generated {len(catalog)} embedded games."
          )
          PY

      - name: Remove temporary files
        run: |
          rm -f truffled-games.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games games.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update embedded games"
          git push
