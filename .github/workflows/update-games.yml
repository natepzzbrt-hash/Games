name: Update Game Sources

on:
  push:
    branches: [main]
    paths-ignore:
      - games.json
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build combined game source catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, re, sys, urllib.request, urllib.parse
          from pathlib import Path

          OUT = Path("games.json")
          API = "https://api.github.com"
          JSDELIVR = "https://cdn.jsdelivr.net/gh"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Game-Library-Source-Updater",
                      "Accept": "application/vnd.github+json"
                  }
              )
              token = os.environ.get("GH_TOKEN")
              if token and "api.github.com" in url:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def get_text(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Game-Library-Source-Updater"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          def gh_tree(repo, branch="main"):
              data = get_json(f"{API}/repos/{repo}/git/trees/{branch}?recursive=1")
              return [
                  x["path"] for x in data.get("tree", [])
                  if x.get("type") == "blob"
              ]

          def js(repo, path, branch="main"):
              return f"{JSDELIVR}/gh/{repo}@{branch}/{path.lstrip('/')}"

          def raw(repo, path, branch="main"):
              return f"https://raw.githubusercontent.com/{repo}/{branch}/{path.lstrip('/')}"

          def name_from_path(path):
              s = path.rsplit("/", 1)[-1]
              s = re.sub(r"\.(html?|htm)$", "", s, flags=re.I)
              s = re.sub(r"^(cl|game[-_]?)[-_]?", "", s, flags=re.I)
              s = re.sub(r"[-_]+", " ", s)
              return s.strip().title() or "Untitled Game"

          games = []
          errors = []

          def add(name, url, image="", source=""):
              if not name or not url:
                  return
              games.append({
                  "name": str(name).strip(),
                  "url": url,
                  "thumbnail": image or "",
                  "source": source
              })

          # ------------------------------------------------------------
          # Keep the user's own TestGames entries.
          # Existing entries without a source are treated as TestGames.
          # ------------------------------------------------------------
          old = []
          if OUT.exists():
              try:
                  old = json.loads(OUT.read_text(encoding="utf-8"))
                  if not isinstance(old, list):
                      old = []
              except Exception:
                  old = []

          for g in old:
              if not isinstance(g, dict):
                  continue
              source = str(g.get("source", "")).lower()
              if source in ("", "testgames", "github", "local"):
                  item = dict(g)
                  item["source"] = "testgames"
                  if "url" not in item and item.get("folder") and item.get("file"):
                      item["url"] = (
                          "https://natepzzbrt-hash.github.io/Games/"
                          + str(item["folder"]).strip("/")
                          + "/" + str(item["file"]).lstrip("/")
                      )
                  games.append(item)

          # ------------------------------------------------------------
          # UNBL0CKEDZ0NE
          # ------------------------------------------------------------
          try:
              repo = "s0n-1m-cr1n3/sc13nc3"
              paths = gh_tree(repo, "latest")
              for p in paths:
                  if re.search(r"^assets/html/main/.*\.html?$", p, re.I):
                      add(
                          name_from_path(p),
                          js(repo, p, "latest"),
                          js(repo, "assets/img/fallback.png", "latest"),
                          "ubz"
                      )
          except Exception as e:
              errors.append(f"UNBL0CKEDZ0NE: {e}")

          # ------------------------------------------------------------
          # GN-Math / Lumin SDK catalog
          # ------------------------------------------------------------
          try:
              zones = get_json(
                  "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json"
              )
              for z in zones if isinstance(zones, list) else []:
                  if not isinstance(z, dict) or z.get("id") in (None, -1):
                      continue
                  name = z.get("name", "")
                  if str(name).startswith("[!]"):
                      continue

                  url = str(z.get("url", "")).strip()
                  cover = str(z.get("cover", "")).strip()

                  url = url.replace(
                      "{HTML_URL}",
                      "https://cdn.jsdelivr.net/gh/freebuisness/html@main"
                  ).replace(
                      "{COVER_URL}",
                      "https://cdn.jsdelivr.net/gh/freebuisness/covers@main"
                  )

                  if not url.startswith("http"):
                      url = (
                          "https://cdn.jsdelivr.net/gh/freebuisness/html@main/"
                          + str(z["id"]) + ".html"
                      )

                  if cover:
                      cover = cover.replace(
                          "{COVER_URL}",
                          "https://cdn.jsdelivr.net/gh/freebuisness/covers@main"
                      )
                      if not cover.startswith("http"):
                          cover = (
                              "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/"
                              + cover.lstrip("/")
                          )

                  add(name, url, cover, "gn")
          except Exception as e:
              errors.append(f"GN-Math: {e}")

          # Lumin uses the same current catalog, but remains a separate source.
          try:
              zones = get_json(
                  "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json"
              )
              for z in zones if isinstance(zones, list) else []:
                  if not isinstance(z, dict) or not z.get("url"):
                      continue
                  url = str(z["url"]).replace(
                      "{HTML_URL}",
                      "https://cdn.jsdelivr.net/gh/freebuisness/html@main"
                  ).replace(
                      "{COVER_URL}",
                      "https://cdn.jsdelivr.net/gh/freebuisness/covers@main"
                  )
                  if not url.startswith("http"):
                      continue
                  cover = str(z.get("cover", "")).replace(
                      "{COVER_URL}",
                      "https://cdn.jsdelivr.net/gh/freebuisness/covers@main"
                  )
                  if cover and not cover.startswith("http"):
                      cover = (
                          "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/"
                          + cover.lstrip("/")
                      )
                  add(z.get("name", "Untitled Game"), url, cover, "lumin")
          except Exception as e:
              errors.append(f"Lumin SDK: {e}")

          # ------------------------------------------------------------
          # Elite Gamez
          # ------------------------------------------------------------
          try:
              base = "https://cdn.jsdelivr.net/gh/1234chromebook1234-creator/ww@main"
              data = get_json(base + "/games.json")
              for g in data if isinstance(data, list) else []:
                  url = str(g.get("url", "")).strip()
                  img = str(g.get("image", "")).strip()
                  if url and not url.startswith("http"):
                      url = base + "/" + url.lstrip("/")
                  if img and not img.startswith("http"):
                      img = base + "/" + img.lstrip("/")
                  add(g.get("title") or g.get("name"), url, img, "elite")
          except Exception as e:
              errors.append(f"Elite Gamez: {e}")

          # ------------------------------------------------------------
          # Ultimate Game Stash
          # ------------------------------------------------------------
          for repo in ("tharun9772/ugs-1", "tharun9772/ugs-2", "tharun9772/ugs-3"):
              try:
                  for p in gh_tree(repo, "main"):
                      if re.match(r"^cl.*\.html?$", p, re.I):
                          add(
                              name_from_path(p),
                              js(repo, p, "main"),
                              "https://cdn.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/img/fallback.png",
                              "ugs"
                          )
              except Exception as e:
                  errors.append(f"UGS {repo}: {e}")

          # ------------------------------------------------------------
          # Seraph
          # ------------------------------------------------------------
          try:
              data = get_json(
                  "https://cdn.jsdelivr.net/gh/DominumNetwork/dominum@main/"
                  "src/assets/libraries/seraph/games.json"
              )
              base = "https://cdn.jsdelivr.net/gh/a456pur/seraph@main/games/"
              for g in data if isinstance(data, list) else []:
                  url = str(g.get("url", "")).strip()
                  img = str(g.get("img", "")).strip()
                  if url and not url.startswith("http"):
                      url = base + url.lstrip("/")
                  if img and not img.startswith("http"):
                      img = base + img.lstrip("/")
                  add(g.get("name"), url, img, "seraph")
          except Exception as e:
              errors.append(f"Seraph: {e}")

          # ------------------------------------------------------------
          # Chicken Kings Vault
          # ------------------------------------------------------------
          try:
              base = "https://cdn.jsdelivr.net/gh/carbonicality/ChickenKingsVault@main"
              data = get_json(base + "/games.json")
              for g in data if isinstance(data, list) else []:
                  url = str(g.get("html", "")).strip()
                  img = str(g.get("img", "")).strip()
                  if url and not url.startswith("http"):
                      url = base + "/gamefiles/" + url.lstrip("/")
                  if img and not img.startswith("http"):
                      img = base + "/images/" + img.lstrip("/")
                  add(g.get("name"), url, img, "ckv")
          except Exception as e:
              errors.append(f"Chicken Kings Vault: {e}")

          # ------------------------------------------------------------
          # Noah's Tutoring
          # ------------------------------------------------------------
          try:
              base = "https://cdn.jsdelivr.net/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master"
              loaded = False

              try:
                  data = get_json(base + "/games.json")
                  entries = data if isinstance(data, list) else data.get("games", [])
                  for g in entries if isinstance(entries, list) else []:
                      url = str(g.get("url", "")).strip()
                      img = str(g.get("image") or g.get("img") or "").strip()
                      if url and not url.startswith("http"):
                          url = base + "/" + url.lstrip("/")
                      if img and not img.startswith("http"):
                          img = base + "/images/" + img.lstrip("/")
                      add(g.get("title") or g.get("name"), url, img, "noah")
                  loaded = True
              except Exception:
                  pass

              if not loaded:
                  js_text = get_text(base + "/games.js")
                  pattern = re.compile(
                      r'\{\s*title:\s*["\'](.*?)["\'].*?'
                      r'url:\s*["\'](.*?)["\'](?:.*?'
                      r'image:\s*["\'](.*?)["\'])?.*?\}',
                      re.S
                  )
                  for m in pattern.finditer(js_text):
                      title, url, img = m.group(1), m.group(2), m.group(3) or ""
                      if not url.startswith("http"):
                          url = base + "/" + url.lstrip("/")
                      if img and not img.startswith("http"):
                          img = base + "/images/" + img.lstrip("/")
                      add(title, url, img, "noah")
          except Exception as e:
              errors.append(f"Noah's Tutoring: {e}")

          # ------------------------------------------------------------
          # Truffled
          # ------------------------------------------------------------
          try:
              data = get_json("https://truffled.lol/js/json/g.json")
              entries = data if isinstance(data, list) else data.get("games", [])
              for g in entries if isinstance(entries, list) else []:
                  url = str(g.get("url", "")).strip()
                  img = str(
                      g.get("thumbnail") or g.get("image") or g.get("img") or ""
                  ).strip()
                  if url:
                      url = urllib.parse.urljoin("https://truffled.lol/", url)
                  if img:
                      img = urllib.parse.urljoin("https://truffled.lol/", img)
                  add(g.get("name") or g.get("title"), url, img, "truffled")
          except Exception as e:
              errors.append(f"Truffled: {e}")

          # ------------------------------------------------------------
          # Deduplicate, keeping TestGames first.
          # ------------------------------------------------------------
          final = []
          seen = set()

          for g in games:
              url = str(g.get("url", "")).strip()
              if not url or url in seen:
                  continue
              seen.add(url)
              final.append(g)

          external = [g for g in final if g.get("source") != "testgames"]

          # Safety against a broken source update wiping the library.
          if not external:
              print("No external sources loaded. Refusing to overwrite games.json.")
              for e in errors:
                  print("WARNING:", e)
              sys.exit(0)

          OUT.write_text(
              json.dumps(final, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"Wrote {len(final)} games ({len(external)} external source games).")
          for e in errors:
              print("WARNING:", e)
          PY

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update game source catalog"
          git push
