name: Update Truffled Games

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Truffled game list
        run: |
          curl -L --fail \
            "https://truffled.lol/js/json/g.json" \
            -o truffled-games.json

      - name: Generate game folders
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          with open("truffled-games.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          if not games:
              raise SystemExit(
                  "ERROR: No games found. Nothing will be changed."
              )

          os.makedirs("games", exist_ok=True)

          library = []

          for game in games:

              name = str(game.get("name", "")).strip()
              source_url = str(game.get("url", "")).strip()
              thumbnail = str(game.get("thumbnail", "")).strip()

              if not name or not source_url:
                  continue

              # ----------------------------------
              # MAKE THE REAL TRUFFLED GAME URL
              # ----------------------------------

              if source_url.startswith("/"):
                  game_url = "https://truffled.lol" + source_url
              else:
                  game_url = "https://truffled.lol/" + source_url.lstrip("/")

              # ----------------------------------
              # MAKE THE THUMBNAIL URL
              # ----------------------------------

              if thumbnail:
                  if thumbnail.startswith("/"):
                      thumbnail_url = "https://truffled.lol" + thumbnail
                  elif thumbnail.startswith("http"):
                      thumbnail_url = thumbnail
                  else:
                      thumbnail_url = "https://truffled.lol/" + thumbnail
              else:
                  thumbnail_url = ""

              # ----------------------------------
              # CREATE SAFE FOLDER NAME
              # ----------------------------------

              slug = re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "-",
                  name
              ).strip("-").lower()

              if not slug:
                  continue

              folder = os.path.join("games", slug)

              os.makedirs(folder, exist_ok=True)

              # ----------------------------------
              # CREATE EMBED PAGE
              # ----------------------------------

              html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>{name}</title>

          <style>
          html,
          body {{
              margin: 0;
              padding: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
          }}

          iframe {{
              position: fixed;
              top: 0;
              left: 0;
              width: 100vw;
              height: 100vh;
              border: none;
          }}
          </style>

          </head>

          <body>

          <iframe
              src="{game_url}"
              frameborder="0"
              allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
              allowfullscreen>
          </iframe>

          </body>
          </html>
          """

              with open(
                  os.path.join(folder, "index.html"),
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(html)

              # ----------------------------------
              # ADD GAME TO LIBRARY
              # ----------------------------------

              entry = {
                  "name": name,
                  "url": f"games/{slug}/",
                  "embed": game_url,
                  "thumbnail": thumbnail_url
              }

              # Keep alternate names if available
              if game.get("altNames"):
                  entry["altNames"] = game["altNames"]

              library.append(entry)

          # ----------------------------------
          # SAFETY CHECK
          # ----------------------------------

          if not library:
              raise SystemExit(
                  "ERROR: No usable games were generated."
              )

          # Sort alphabetically
          library.sort(
              key=lambda game: game["name"].lower()
          )

          # ----------------------------------
          # SAVE games.json
          # ----------------------------------

          with open(
              "games.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  library,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print(
              f"Successfully generated {len(library)} games."
          )
          PY

      - name: Remove temporary file
        run: |
          rm -f truffled-games.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games games.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update games from Truffled"

          git push
