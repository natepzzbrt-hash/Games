name: Update Game Library

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Truffled game list
        run: |
          curl -L \
            "https://truffled.lol/js/json/g.json" \
            -o truffled-games.json

      - name: Generate games.json
        run: |
          python3 <<'PY'
          import json
          from urllib.parse import urljoin

          BASE = "https://truffled.lol"

          with open("truffled-games.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          output = []

          for game in games:
              name = game.get("name")
              game_url = game.get("url")
              thumbnail = game.get("thumbnail")

              if not name or not game_url:
                  continue

              game_url = urljoin(BASE, game_url)

              if thumbnail:
                  thumbnail = urljoin(BASE, thumbnail)
              else:
                  thumbnail = ""

              output.append({
                  "name": name,
                  "url": game_url,
                  "thumbnail": thumbnail
              })

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Added {len(output)} games")
          PY

      - name: Show result
        run: |
          echo "===== games.json ====="
          cat games.json

      - name: Commit updated games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update game library"
            git push
          fi
