name: Generate and Deploy Game Library

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  generate:
    name: Generate games.json
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate games.json
        run: |
          python3 <<'PY'
          import os
          import json

          games = []

          ignored_folders = {
              ".git",
              ".github",
              "node_modules"
          }

          logo_names = [
              "logo.png",
              "logo.jpg",
              "logo.jpeg",
              "logo.webp",
              "icon.png",
              "icon.jpg",
              "icon.jpeg",
              "icon.webp",
              "thumbnail.png",
              "thumbnail.jpg",
              "thumbnail.jpeg",
              "thumbnail.webp"
          ]

          for root, dirs, files in os.walk("."):

              dirs[:] = [
                  d for d in dirs
                  if d not in ignored_folders
                  and not d.startswith(".")
              ]

              folder = root

              if folder.startswith("./"):
                  folder = folder[2:]

              if not folder:
                  continue

              if any(
                  part.startswith(".")
                  for part in folder.split("/")
              ):
                  continue

              html_files = [
                  f for f in files
                  if f.lower().endswith(".html")
              ]

              if not html_files:
                  continue

              html_files.sort(
                  key=lambda f: (
                      0 if f.lower() == "index.html" else 1,
                      f.lower()
                  )
              )

              game_file = html_files[0]

              logo = None

              for logo_name in logo_names:
                  for file in files:

                      if file.lower() == logo_name.lower():
                          logo = file
                          break

                  if logo:
                      break

              game_name = folder.split("/")[-1]

              games.append({
                  "name": game_name,
                  "folder": folder,
                  "file": game_file,
                  "logo": (
                      folder + "/" + logo
                      if logo
                      else None
                  )
              })

          unique = {}

          for game in games:
              unique[game["folder"]] = game

          games = list(unique.values())

          games.sort(
              key=lambda game:
              game["name"].lower()
          )

          with open(
              "games.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("==============================")
          print(" Games found:", len(games))
          print("==============================")

          for game in games:
              print(
                  game["name"],
                  "->",
                  game["folder"] + "/" + game["file"]
              )

          PY

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet games.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit games.json
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          git commit -m "Update game library"

          git push


  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
