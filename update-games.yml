```yaml
name: Generate Game Library

on:
  push:
    branches:
      - main
    paths-ignore:
      - games.json
      - "games/**"

  workflow_dispatch:

  schedule:
    # Update once every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Discover games
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import time
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          SITE = "https://truffled.lol"
          GAMES_PAGE = "https://truffled.lol/g"
          GAMES_DIR = "games"
          JSON_FILE = "games.json"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/140 Safari/537.36"
              )
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          os.makedirs(GAMES_DIR, exist_ok=True)

          print("Fetching Truffled games page...")
          response = session.get(
              GAMES_PAGE,
              timeout=30
          )

          response.raise_for_status()

          html = response.text

          print(
              "Downloaded",
              len(html),
              "bytes"
          )

          # ---------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------

          def clean_name(value):
              value = value.strip()

              value = re.sub(
                  r"<[^>]+>",
                  "",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def slugify(value):
              value = value.lower().strip()

              value = re.sub(
                  r"[^a-z0-9_-]+",
                  "-",
                  value
              )

              value = re.sub(
                  r"-+",
                  "-",
                  value
              )

              return value.strip("-")


          def valid_game_url(url):
              try:
                  parsed = urlparse(url)

                  if parsed.scheme not in (
                      "http",
                      "https"
                  ):
                      return False

                  path = parsed.path.rstrip("/")

                  return (
                      path.startswith("/games/")
                      and len(path) > len("/games/")
                  )

              except Exception:
                  return False


          # ---------------------------------------------------------
          # Discover URLs from HTML
          # ---------------------------------------------------------

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          discovered = {}

          # Normal <a href="">
          for tag in soup.find_all("a"):

              href = tag.get("href")

              if not href:
                  continue

              absolute = urljoin(
                  SITE,
                  href
              )

              if not valid_game_url(absolute):
                  continue

              absolute = absolute.rstrip("/")

              path = urlparse(
                  absolute
              ).path

              slug = path.split("/")[-1]

              title = clean_name(
                  tag.get_text(" ", strip=True)
              )

              if not title:
                  title = slug.replace(
                      "-",
                      " "
                  ).title()

              discovered[absolute] = {
                  "url": absolute + "/",
                  "slug": slug,
                  "name": title
              }


          # ---------------------------------------------------------
          # Also search raw JavaScript for /games/... URLs
          # ---------------------------------------------------------

          patterns = [
              r'https?://[^"\']+/games/[A-Za-z0-9_-]+/?',
              r'["\'](/games/[A-Za-z0-9_-]+/?)["\']',
              r'["\'](games/[A-Za-z0-9_-]+/?)["\']'
          ]

          for pattern in patterns:

              matches = re.findall(
                  pattern,
                  html,
                  flags=re.IGNORECASE
              )

              for match in matches:

                  if match.startswith("http"):
                      url = match
                  else:
                      url = urljoin(
                          SITE + "/",
                          match
                      )

                  if not valid_game_url(url):
                      continue

                  url = url.rstrip("/")

                  path = urlparse(
                      url
                  ).path

                  slug = path.split("/")[-1]

                  name = slug.replace(
                      "-",
                      " "
                  ).replace(
                      "_",
                      " "
                  ).title()

                  discovered[url] = {
                      "url": url + "/",
                      "slug": slug,
                      "name": name
                  }


          print(
              "Discovered",
              len(discovered),
              "possible game URLs."
          )


          # ---------------------------------------------------------
          # Check which URLs actually work
          # ---------------------------------------------------------

          working = []

          for number, game in enumerate(
              discovered.values(),
              start=1
          ):

              url = game["url"]

              print(
                  f"[{number}/{len(discovered)}] "
                  f"Checking {url}"
              )

              try:

                  r = session.get(
                      url,
                      timeout=20,
                      allow_redirects=True
                  )

                  if (
                      r.status_code >= 200
                      and r.status_code < 400
                  ):

                      game["status"] = r.status_code

                      # Don't keep enormous pages in memory.
                      game["content_type"] = (
                          r.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      working.append(game)

                      print(
                          "  OK:",
                          r.status_code
                      )

                  else:

                      print(
                          "  SKIP:",
                          r.status_code
                      )

              except Exception as e:

                  print(
                      "  ERROR:",
                      str(e)
                  )

              # Be polite to the server.
              time.sleep(0.15)


          print(
              "\nWorking games:",
              len(working)
          )


          # ---------------------------------------------------------
          # Logo finder
          # ---------------------------------------------------------

          def find_logo(game_url, folder):

              try:

                  r = session.get(
                      game_url,
                      timeout=20
                  )

                  if r.status_code != 200:
                      return None

                  page = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  candidates = []

                  # OpenGraph image
                  for meta in page.find_all(
                      "meta"
                  ):

                      prop = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      content = meta.get(
                          "content"
                      )

                      if (
                          content
                          and prop in (
                              "og:image",
                              "twitter:image",
                              "twitter:image:src"
                          )
                      ):

                          candidates.append(
                              content
                          )


                  # Favicon / icon
                  for link in page.find_all(
                      "link"
                  ):

                      rel = link.get(
                          "rel",
                          []
                      )

                      rel_text = " ".join(
                          rel
                      ).lower()

                      href = link.get(
                          "href"
                      )

                      if (
                          href
                          and "icon" in rel_text
                      ):

                          candidates.append(
                              href
                          )


                  # Image tags as fallback
                  for image in page.find_all(
                      "img"
                  ):

                      src = image.get(
                          "src"
                      )

                      if src:
                          candidates.append(
                              src
                          )


                  for image_url in candidates:

                      image_url = urljoin(
                          game_url,
                          image_url
                      )

                      try:

                          image_response = session.get(
                              image_url,
                              timeout=15
                          )

                          if (
                              image_response.status_code
                              != 200
                          ):
                              continue

                          content_type = (
                              image_response
                              .headers
                              .get(
                                  "content-type",
                                  ""
                              )
                              .lower()
                          )

                          if not content_type.startswith(
                              "image/"
                          ):
                              continue

                          extension = ".png"

                          if "jpeg" in content_type:
                              extension = ".jpg"

                          elif "webp" in content_type:
                              extension = ".webp"

                          elif "gif" in content_type:
                              extension = ".gif"

                          elif "svg" in content_type:
                              extension = ".svg"

                          logo_file = os.path.join(
                              folder,
                              "logo" + extension
                          )

                          with open(
                              logo_file,
                              "wb"
                          ) as f:

                              f.write(
                                  image_response.content
                              )

                          return (
                              "logo" + extension
                          )

                      except Exception:
                          continue

              except Exception as e:

                  print(
                      "Logo error:",
                      e
                  )

              return None


          # ---------------------------------------------------------
          # Create folders
          # ---------------------------------------------------------

          games = []

          for game in working:

              slug = slugify(
                  game["slug"]
              )

              if not slug:
                  continue

              folder = os.path.join(
                  GAMES_DIR,
                  slug
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )

              game_url = game["url"]

              # ---------------------------------------------------
              # Create local launcher
              # ---------------------------------------------------

              index_html = f"""<!DOCTYPE html>
          <html lang="en">

          <head>

              <meta charset="UTF-8">

              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
              >

              <title>{game["name"]}</title>

              <style>

                  html,
                  body {{
                      margin: 0;
                      padding: 0;
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                      background: #000;
                  }}

                  iframe {{
                      position: fixed;
                      inset: 0;
                      width: 100vw;
                      height: 100vh;
                      border: 0;
                      display: block;
                  }}

              </style>

          </head>

          <body>

              <iframe
                  src="{game_url}"
                  allow="
                      fullscreen;
                      autoplay;
                      gamepad;
                      clipboard-read;
                      clipboard-write
                  "
                  allowfullscreen>
              </iframe>

          </body>

          </html>
          """

              with open(
                  os.path.join(
                      folder,
                      "index.html"
                  ),
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      index_html
                  )


              # ---------------------------------------------------
              # Find logo
              # ---------------------------------------------------

              logo = find_logo(
                  game_url,
                  folder
              )


              # ---------------------------------------------------
              # Save metadata
              # ---------------------------------------------------

              games.append({
                  "name": game["name"],
                  "slug": slug,
                  "url": game_url,
                  "path": (
                      f"games/{slug}/index.html"
                  ),
                  "logo": (
                      f"games/{slug}/{logo}"
                      if logo
                      else None
                  )
              })

              print(
                  "Created:",
                  slug,
                  "| logo:",
                  logo or "none"
              )


          # ---------------------------------------------------------
          # Sort alphabetically
          # ---------------------------------------------------------

          games.sort(
              key=lambda game:
              game["name"].lower()
          )


          # ---------------------------------------------------------
          # Generate games.json
          # ---------------------------------------------------------

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  games,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "\n================================"
          )

          print(
              "Finished!"
          )

          print(
              "Games:",
              len(games)
          )

          print(
              "================================"
          )

          PY

      - name: Remove deleted games
        run: |
          python3 <<'PY'
          import os
          import json
          import shutil

          games_dir = "games"

          if not os.path.exists("games.json"):
              raise SystemExit(0)

          with open(
              "games.json",
              "r",
              encoding="utf-8"
          ) as f:
              games = json.load(f)

          valid = {
              game["slug"]
              for game in games
          }

          if not os.path.exists(games_dir):
              raise SystemExit(0)

          for item in os.listdir(games_dir):

              path = os.path.join(
                  games_dir,
                  item
              )

              if (
                  os.path.isdir(path)
                  and item not in valid
              ):

                  print(
                      "Removing old game:",
                      item
                  )

                  shutil.rmtree(
                      path
                  )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games games.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-update game library"
            git push
          fi
```
